<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamer sign up form</title>
    <link
      href="https://fonts.googleapis.com/css?family=Orbitron:regular,800"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=JetBrains+Mono:100,200,300,regular,500,600,700,800,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/images/favicon-32x32.png"
    />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="intro-panel">
        <span class="logo">
          <img src="assets/images/logo.svg" alt="NEONCORE" />
        </span>
        <div class="main-heading">
          <img src="" alt="" />
          <h1>JOIN THE NEXUS</h1>
          <p>INITIALIZE YOUR NEONCORE IDENTITY</p>
        </div>
        <hr />
        <div class="sign-up-status">
          <div class="operator-id">
            <p>Operator ID</p>
            <p>0/5 Ready</p>
          </div>
          <div class="name">unassigned</div>
          <ul class="textfield-status">
            <li>
              <span>CALLSIGN </span>

              <span>Pending</span>
            </li>
            <li>
              <span>EMAIL</span>

              <span>Pending</span>
            </li>
            <li>
              <span>PASSWORD</span>

              <span>Pending</span>
            </li>
            <li>
              <span>CONFIRM</span>
              <span>Pending</span>
            </li>
            <li>
              <span>TERMS</span>
              <span>Pending</span>
            </li>
          </ul>
        </div>
      </div>
      <div class="sign-up"></div>
    </main>
  </body>
</html>
