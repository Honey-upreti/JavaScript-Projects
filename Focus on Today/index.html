<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus on today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1 class="title">Focus on <span>Today</span></h1>
      <div class="app-container">
        <h2 class="subtitle">
          Today
          <div class="image-container">
            <img src="/images/🦆 icon _Sun_.svg" alt="sun" class="base-img" />
            <img src="/images/Group 3.svg" alt="smiley" class="overlay-img" />
          </div>
        </h2>
        <p class="progress-label">Raise the bar by completing your goals!</p>
        <div class="progress-bar">
          <div class="progress-value">
            <span>2/3 completed</span>
          </div>
          <p class="error-label">Please set all the 3 goals!</p>
        </div>

        <div class="goal-container">
          <div class="custom-checkbox">
            <img
              class="check-icon"
              src="/images/tick icon.svg"
              alt="checkbox"
            />
          </div>
          <input
            id="first"
            class="goal-input"
            type="text"
            placeholder="Add a new goal"
          />
        </div>
        <div class="goal-container">
          <div class="custom-checkbox">
            <img
              class="check-icon"
              src="/images/tick icon.svg"
              alt="checkbox"
            />
          </div>
          <input
            id="second"
            class="goal-input"
            type="text"
            placeholder="Add a new goal"
          />
        </div> 
        <div class="goal-container">
          <div class="custom-checkbox">
            <img
              class="check-icon"
              src="/images/tick icon.svg"
              alt="checkbox"
            />
          </div>
          <input
            id="third"
            class="goal-input"
            type="text"
            placeholder="Add a new goal"
          />
        </div>
        <div class="goal-container">
          <div class="custom-checkbox">
            <img
              class="check-icon"
              src="/images/tick icon.svg"
              alt="checkbox"
            />
          </div>
          <input
            id="fourth"
            class="goal-input"
            type="text"
            placeholder="Add a new goal"
          />
        </div>
        <p class="quote">"Move one step ahead today!"</p>
        <div class="made-with">"From a lazy guy to a lazy guy!"</div>
      </div>
    </main>
  </body>
</html>
